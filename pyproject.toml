[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findyourcode"
version = "0.3.0"
description = "Semantic code search: find code by meaning, not by text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mekkadev" }]
keywords = [
    "code-search",
    "semantic-search",
    "embeddings",
    "tree-sitter",
    "sqlite",
    "vector-search",
    "rag",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.4",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mekkadev/findyourcode"
Source = "https://github.com/mekkadev/findyourcode"
Issues = "https://github.com/mekkadev/findyourcode/issues"
Changelog = "https://github.com/mekkadev/findyourcode/blob/main/CHANGELOG.md"

[project.optional-dependencies]
local = ["fastembed>=0.4"]
vec = ["sqlite-vec>=0.1.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
all = [
    "fastembed>=0.4",
    "sqlite-vec>=0.1.6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fyc = "findyourcode.cli:main"
findyourcode = "findyourcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
findyourcode = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # argparse and dataclass defaults read fine as calls
    "SIM108", # a ternary is not always clearer than an if
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
files = ["src/findyourcode"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
